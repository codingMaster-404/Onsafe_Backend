name: Deploy to Cloud Run

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - '.env.example'
      - 'infra/**'
  workflow_dispatch:
    inputs:
      target:
        description: '배포 대상'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - kotlin-only
          - python-only

concurrency:
  group: deploy-cloudrun
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write  # Workload Identity Federation OIDC 토큰 발급용

env:
  GCP_REGION: asia-northeast3
  ARTIFACT_REPO: onsafe
  KOTLIN_SERVICE: onsafe-kotlin-api
  PYTHON_SERVICE: onsafe-python-ai
  KOTLIN_IMAGE_NAME: kotlin-api
  PYTHON_IMAGE_NAME: python-ai

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # 1. Kotlin API 배포 (public, allow-unauthenticated)
  # ────────────────────────────────────────────────────────────────────────────
  deploy-kotlin:
    if: github.event_name == 'push' || inputs.target == 'both' || inputs.target == 'kotlin-only'
    runs-on: ubuntu-latest
    outputs:
      kotlin_url: ${{ steps.deploy.outputs.url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP via WIF
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: onsafe-deployer@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker auth for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build & Push Kotlin image
        run: |
          IMAGE_URI="${{ env.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/${{ env.KOTLIN_IMAGE_NAME }}"
          docker build -f Dockerfile.kotlin \
            -t "$IMAGE_URI:${{ github.sha }}" \
            -t "$IMAGE_URI:latest" \
            .
          docker push "$IMAGE_URI:${{ github.sha }}"
          docker push "$IMAGE_URI:latest"
          echo "IMAGE_URI=$IMAGE_URI" >> $GITHUB_ENV

      # --set-env-vars는 배포마다 환경변수 전체를 교체한다 — 콘솔에서 바꾼 값은 다음 배포에서 사라지므로
      # 운영 스위치(RETENTION_BACKFILL_ENABLED·CONSENT_ENFORCEMENT_ENABLED)는 GitHub 저장소 변수로 관리한다(미등록이면 false).
      - name: Deploy Kotlin API to Cloud Run
        id: deploy
        run: |
          gcloud run deploy ${{ env.KOTLIN_SERVICE }} \
            --image "${IMAGE_URI}:${{ github.sha }}" \
            --region ${{ env.GCP_REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --service-account "onsafe-cloudrun@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com" \
            --vpc-connector onsafe-connector \
            --vpc-egress private-ranges-only \
            --port 8080 \
            --memory 1Gi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 10 \
            --timeout 300 \
            --set-env-vars "SPRING_PROFILES_ACTIVE=prod,TZ=Asia/Seoul,FIREBASE_STORAGE_BUCKET=${{ vars.FIREBASE_STORAGE_BUCKET }},REDIS_HOST=${{ vars.REDIS_HOST }},REDIS_PORT=6379,RETENTION_BACKFILL_ENABLED=${{ vars.RETENTION_BACKFILL_ENABLED || 'false' }},CONSENT_ENFORCEMENT_ENABLED=${{ vars.CONSENT_ENFORCEMENT_ENABLED || 'false' }}" \
            --set-secrets "JWT_SECRET=JWT_SECRET:latest,ENCRYPTION_AES_KEY=ENCRYPTION_AES_KEY:latest,INTERNAL_JOB_SECRET=INTERNAL_JOB_SECRET:latest" \
            --quiet

          URL=$(gcloud run services describe ${{ env.KOTLIN_SERVICE }} --region ${{ env.GCP_REGION }} --format 'value(status.url)')
          echo "Kotlin API URL: $URL"
          echo "url=$URL" >> $GITHUB_OUTPUT

      # firestore.indexes.json 이 레포에만 있고 어디서도 적용되지 않았다(C13). 인덱스가 없으면
      # 복합 쿼리(보안 이벤트 조회·낙상 이력 등)가 런타임에 실패한다. 인프라는 CI/CD로만 구성하므로
      # 여기서 적용한다. 이미 있는 인덱스는 건너뛰므로 재실행해도 안전하다.
      - name: Apply Firestore indexes
        run: |
          npx --yes firebase-tools deploy --only firestore:indexes \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --non-interactive || echo "인덱스 적용 실패 — 배포는 계속 진행(수동 확인 필요)"

      # 보관 기간 강제(낙상 30일·알림 7일): 저장 시 기록하는 expired_at(Timestamp)에 TTL 정책을 건다.
      # TTL 삭제는 만료 후 최대 24시간 늦을 수 있어 조회 쿼리에서도 기간 필터를 함께 건다(Repository).
      # 정책 생성은 수 분 이상 걸려 --async로 배포를 막지 않는다. 인프라는 CI/CD로만 구성하므로 여기서 적용한다.
      - name: Apply Firestore TTL policies
        run: |
          for group in fall_logs notifications; do
            gcloud firestore fields ttls update expired_at \
              --collection-group="${group}" \
              --enable-ttl \
              --async \
              --project="${{ vars.GCP_PROJECT_ID }}" \
              --quiet \
            || echo "::warning::TTL 정책 적용 실패(${group}) — 배포는 계속 진행(수동 확인 필요)"
          done

      # Firestore TTL은 GCS 객체를 지우지 않으므로 낙상 영상(fall-videos/)은 버킷 lifecycle로 같은 30일에 지운다.
      # --lifecycle-file은 버킷의 기존 규칙 전체를 이 파일로 교체한다.
      - name: Apply GCS lifecycle
        run: |
          gcloud storage buckets update "gs://${{ vars.FIREBASE_STORAGE_BUCKET }}" \
            --lifecycle-file=gcs-lifecycle.json \
            --quiet \
          || echo "::warning::GCS lifecycle 적용 실패 — 배포는 계속 진행(수동 확인 필요)"

      # 잡 엔드포인트는 있는데 트리거가 어디에도 등록돼 있지 않았다(C12) — 로그인 이력 정리와
      # 카메라 오프라인 워치독이 운영에서 실행되지 않는 상태였다. 인프라는 CI/CD로만 구성하므로
      # 여기서 등록한다. create가 이미 있으면 실패하므로 update로 떨어뜨려 재실행 가능하게 둔다.
      - name: Register Cloud Scheduler jobs
        run: |
          KOTLIN_URL=$(gcloud run services describe ${{ env.KOTLIN_SERVICE }} --region ${{ env.GCP_REGION }} --format 'value(status.url)')
          SECRET=$(gcloud secrets versions access latest --secret=INTERNAL_JOB_SECRET)
          register() {
            name="$1"; cron="$2"
            gcloud scheduler jobs create http "onsafe-${name}" \
              --location=${{ env.GCP_REGION }} \
              --schedule="${cron}" --time-zone="Asia/Seoul" \
              --uri="${KOTLIN_URL}/internal/jobs/${name}" \
              --http-method=POST \
              --headers="X-Internal-Auth=${SECRET}" \
              --quiet \
            || gcloud scheduler jobs update http "onsafe-${name}" \
              --location=${{ env.GCP_REGION }} \
              --schedule="${cron}" --time-zone="Asia/Seoul" \
              --uri="${KOTLIN_URL}/internal/jobs/${name}" \
              --http-method=POST \
              --headers="X-Internal-Auth=${SECRET}" \
              --quiet
          }
          register "login-history-cleanup" "0 3 * * *"
          register "heartbeat-watchdog"    "*/5 * * * *"
          register "deletion-retry"        "0 * * * *"
          register "retention-backfill"    "30 3 * * *"

  # ────────────────────────────────────────────────────────────────────────────
  # 2. Python AI 배포 (internal only, Kotlin URL 을 env로 주입)
  # ────────────────────────────────────────────────────────────────────────────
  deploy-python:
    needs: [ deploy-kotlin ]
    # deploy-kotlin이 성공 or skipped(python-only 옵션 등)이면 진행
    if: |
      always() &&
      (needs.deploy-kotlin.result == 'success' || needs.deploy-kotlin.result == 'skipped') &&
      (github.event_name == 'push' || inputs.target == 'both' || inputs.target == 'python-only')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP via WIF
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: onsafe-deployer@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker auth for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Resolve Kotlin service URL
        id: kotlin_url
        run: |
          if [ -n "${{ needs.deploy-kotlin.outputs.kotlin_url }}" ]; then
            URL="${{ needs.deploy-kotlin.outputs.kotlin_url }}"
          else
            URL=$(gcloud run services describe ${{ env.KOTLIN_SERVICE }} --region ${{ env.GCP_REGION }} --format 'value(status.url)')
          fi
          echo "Kotlin URL: $URL"
          echo "url=$URL" >> $GITHUB_OUTPUT

      - name: Build & Push Python image
        run: |
          IMAGE_URI="${{ env.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/${{ env.PYTHON_IMAGE_NAME }}"
          docker build -f Dockerfile.python \
            -t "$IMAGE_URI:${{ github.sha }}" \
            -t "$IMAGE_URI:latest" \
            .
          docker push "$IMAGE_URI:${{ github.sha }}"
          docker push "$IMAGE_URI:latest"
          echo "IMAGE_URI=$IMAGE_URI" >> $GITHUB_ENV

      - name: Deploy Python AI to Cloud Run (internal)
        run: |
          gcloud run deploy ${{ env.PYTHON_SERVICE }} \
            --image "${IMAGE_URI}:${{ github.sha }}" \
            --region ${{ env.GCP_REGION }} \
            --platform managed \
            --no-allow-unauthenticated \
            --ingress internal-and-cloud-load-balancing \
            --service-account "onsafe-cloudrun@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com" \
            --vpc-connector onsafe-connector \
            --vpc-egress all-traffic \
            --port 8000 \
            --memory 2Gi \
            --cpu 2 \
            --min-instances 0 \
            --max-instances 5 \
            --timeout 600 \
            --set-env-vars "TZ=Asia/Seoul,FIREBASE_STORAGE_BUCKET=${{ vars.FIREBASE_STORAGE_BUCKET }},REDIS_URL=redis://${{ vars.REDIS_HOST }}:6379,KOTLIN_INTERNAL_BASE=${{ steps.kotlin_url.outputs.url }}" \
            --set-secrets "JWT_SECRET=JWT_SECRET:latest,INTERNAL_JOB_SECRET=INTERNAL_JOB_SECRET:latest" \
            --quiet

          URL=$(gcloud run services describe ${{ env.PYTHON_SERVICE }} --region ${{ env.GCP_REGION }} --format 'value(status.url)')
          echo "Python AI URL (internal): $URL"

  # ────────────────────────────────────────────────────────────────────────────
  # 3. 배포 후 헬스체크
  # ────────────────────────────────────────────────────────────────────────────
  smoke-test:
    needs: [ deploy-kotlin, deploy-python ]
    if: always() && needs.deploy-kotlin.result == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Health check - Kotlin API
        # Cloud Run 콜드스타트가 수분 걸릴 수 있어(첫 배포·이미지 최초 pull 시) 5회 × 10초로는
        # 정상 배포도 실패로 판정될 여지가 크다. 총 5분 대기로 늘려 잘못된 red 를 줄인다.
        run: |
          URL="${{ needs.deploy-kotlin.outputs.kotlin_url }}"
          echo "Pinging $URL/actuator/health"
          for i in $(seq 1 20); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL/actuator/health" || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "Kotlin API healthy"
              exit 0
            fi
            echo "  attempt $i/20: HTTP $STATUS, retrying in 15s..."
            sleep 15
          done
          echo "Kotlin API health check failed"
          exit 1