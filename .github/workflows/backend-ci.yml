name: Backend CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  python-lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check import errors (syntax/import 검증)
        run: python -c "from app.main import app; print('import OK')"
        env:
          FIREBASE_CREDENTIALS: /dev/null
          FIREBASE_STORAGE_BUCKET: dummy
          JWT_SECRET: ci-test-secret-key-32-chars-long!!
          REDIS_URL: redis://localhost:6379
          KOTLIN_INTERNAL_BASE: http://localhost:8080

      - name: Run Python tests
        run: |
          pip install pytest pytest-asyncio
          if find app -name 'test_*.py' -o -name '*_test.py' | grep -q .; then
            pytest app/ -v --tb=short
          else
            echo "테스트 파일 없음 — 건너뜀"
          fi
        env:
          FIREBASE_CREDENTIALS: /dev/null
          FIREBASE_STORAGE_BUCKET: dummy
          JWT_SECRET: ci-test-secret-key-32-chars-long!!
          REDIS_URL: redis://localhost:6379
          KOTLIN_INTERNAL_BASE: http://localhost:8080

  kotlin-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant gradlew permission
        run: chmod +x gradlew

      - name: Run Kotlin tests
        run: ./gradlew test --stacktrace
        env:
          FIREBASE_CREDENTIALS: /dev/null
          JWT_SECRET: ci-test-secret-key-32-chars-long!!
          REDIS_URL: redis://localhost:6379

  # PR 전용 Dockerfile 깨짐 검증 — main push 시엔 deploy-cloudrun.yml 쪽 빌드가 어차피 돌아 중복이다.
  docker-build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: [ python-lint-and-test, kotlin-test ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Python AI Docker image
        run: docker build -f Dockerfile.python -t onsafe-python-ai:${{ github.sha }} .

      - name: Build Kotlin API Docker image
        run: docker build -f Dockerfile.kotlin -t onsafe-kotlin-api:${{ github.sha }} .