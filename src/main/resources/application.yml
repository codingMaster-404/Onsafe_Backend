spring:
  application:
    name: on-safe-backend
  profiles:
    active: local
  jackson:
    property-naming-strategy: SNAKE_CASE
  config:
    import: optional:application-secret.yml
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
server:
  port: 8080

firebase:
  credentials: ${FIREBASE_CREDENTIALS:serviceAccountKey.json}
  storage:
    bucket: ${FIREBASE_STORAGE_BUCKET:}

jwt:
  secret: ${JWT_SECRET:}
  access-token-expiry: 3600000
  refresh-token-expiry: 604800000

encryption:
  aes-key: ${ENCRYPTION_AES_KEY:}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs

aws:
  ses:
    region: ${AWS_REGION:ap-northeast-2}
    from: ${SES_FROM_EMAIL:}

# Cloud Scheduler 가 /internal/jobs/** 트리거 시 X-Internal-Auth 헤더로 첨부하는 시크릿.
# 실제 값은 Secret Manager 슬롯 INTERNAL_JOB_SECRET 에서 주입한다. 로컬에서는 빈 값이므로
# 엔드포인트가 항상 FORBIDDEN 반환 — 실수로 외부에 노출돼도 fail-closed 상태 유지.
internal:
  job:
    secret: ${INTERNAL_JOB_SECRET:}

# Cloud Run 배포 후 워크플로가 /actuator/health 로 헬스체크한다.
# Kotlin API 는 public(--allow-unauthenticated) 로 노출되므로 env/metrics/mappings 같은
# 세부 정보 endpoint 는 반드시 감춘다 — health 만 열고, health 안의 컴포넌트 세부 상태도 숨긴다.
management:
  endpoints:
    web:
      exposure:
        include: health
      base-path: /actuator
  endpoint:
    health:
      show-details: never

logging:
  level:
    com.onsafe: DEBUG
