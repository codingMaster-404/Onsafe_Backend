spring:
  application:
    name: on-safe-backend
  profiles:
    active: local
  jackson:
    property-naming-strategy: SNAKE_CASE
  config:
    import: optional:application-secret.yml
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
server:
  port: 8080

# rate limit·로그인 이력에 쓸 클라이언트 IP를 X-Forwarded-For에서 고를 때,
# 오른쪽에서 몇 번째 값까지가 우리 인프라가 붙인 값인지(C3).
# 현재 배포: Kotlin API는 Cloud Run에 직접 노출(--allow-unauthenticated, ingress 기본값) → 1.
# 앞단에 외부 로드밸런서를 두면 TRUSTED_PROXY_COUNT=2로 바꾸면 된다(코드 수정 불필요).
app:
  trusted-proxy-count: ${TRUSTED_PROXY_COUNT:1}

firebase:
  credentials: ${FIREBASE_CREDENTIALS:serviceAccountKey.json}
  storage:
    bucket: ${FIREBASE_STORAGE_BUCKET:}

jwt:
  secret: ${JWT_SECRET:}
  access-token-expiry: 3600000
  refresh-token-expiry: 2592000000

encryption:
  aes-key: ${ENCRYPTION_AES_KEY:}

# 개정 필수 약관 미동의 시 보호 API 차단(K1·D3). 재동의 목록(pending_consents) 응답은 이 값과 무관하게 항상 나간다.
# 프론트 재동의 모달 배포 전에는 false로 둔다 — true면 동의 기록이 없는 기존 사용자까지 전부 403 CONSENT_REQUIRED가 된다.
# 켜고 끈 효과는 다음 로그인·refresh로 발급되는 access 토큰부터 적용된다(최대 1시간 지연).
consent:
  enforcement-enabled: ${CONSENT_ENFORCEMENT_ENABLED:false}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs

# Cloud Scheduler 가 /internal/jobs/** 트리거 시 X-Internal-Auth 헤더로 첨부하는 시크릿.
# 실제 값은 Secret Manager 슬롯 INTERNAL_JOB_SECRET 에서 주입한다. 로컬에서는 빈 값이므로
# 엔드포인트가 항상 FORBIDDEN 반환 — 실수로 외부에 노출돼도 fail-closed 상태 유지.
internal:
  job:
    secret: ${INTERNAL_JOB_SECRET:}

# Cloud Run 배포 후 워크플로가 /actuator/health 로 헬스체크한다.
# Kotlin API 는 public(--allow-unauthenticated) 로 노출되므로 env/metrics/mappings 같은
# 세부 정보 endpoint 는 반드시 감춘다 — health 만 열고, health 안의 컴포넌트 세부 상태도 숨긴다.
management:
  endpoints:
    web:
      exposure:
        include: health
      base-path: /actuator
  endpoint:
    health:
      show-details: never

logging:
  level:
    com.onsafe: DEBUG